# The nightly price and FX job (PRD Phase 1, step 4): daily closes, Bank of Taiwan rates and the
# gold price into Supabase. Setup and troubleshooting: docs/nightly-job.md.
# 每夜價格與匯率排程：把每日收盤價、臺灣銀行匯率與金價寫入 Supabase。設定方式見 docs/nightly-job.md。
name: Nightly prices 每夜價格

on:
  schedule:
    # 14:23 UTC is 22:23 in Taipei: after Taiwan's close and the Bank of Taiwan's last rate, with
    # the previous US session and the previous AGGU NAV published. GitHub may start it a little late.
    # 台北時間 22:23：台股已收盤、臺銀已公布當日匯率，前一個美股交易日與 AGGU 淨值也已公布。
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load prices, FX rates and gold 載入價格、匯率與金價
        run: npm run nightly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
