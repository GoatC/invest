<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shell look</title>
<!--
  A stand-in for the site, for ios/tests/look.sh only: it talks to the shell exactly as
  components/shell-bridge.tsx does (one `shell` message per change of what the page shows, and
  window.longview for the shell's calls), with pages shaped like the site's: a poster on the
  dashboard, a title and a row of sub-tabs elsewhere, the More list over the page. The yellow line
  at the foot says what the shell told the page (--shell-top, --shell-top-inline, --shell-bottom).
-->
<style>
  html { background: #f2f2f7; }
  body { margin: 0; font: -apple-system-body; color: #000; padding-top: var(--shell-top, 0px); padding-bottom: calc(var(--shell-bottom, 0px) + 40px); }
  body.poster { padding-top: 0; }
  .hero { background: #fafbfa; color: #141a17; border-bottom: 1px solid #dce3df; padding: calc(var(--shell-top-inline, 100px) + 40px) 16px 60px; }
  .hero b { display: block; font-size: 44px; }
  .card { background: #fff; border-radius: 22px; margin: 12px 16px; padding: 16px; min-height: 90px; }
  .sheet { position: fixed; inset: 0; z-index: 5; background: #f2f2f7; padding: calc(var(--shell-top-inline, 100px) + 12px) 16px 0; }
  #probe { position: fixed; left: 8px; right: 8px; bottom: calc(var(--shell-bottom, 0px) + 6px); z-index: 9; font: 12px/1.3 ui-monospace, monospace; background: #ffeb3b; color: #000; padding: 3px 6px; border-radius: 6px; }
</style>
</head>
<body>
<main id="main"></main>
<div id="probe"></div>
<script>
  const TABS = [
    { key: '/holdings', title: '持倉' },
    { key: '/performance', title: '績效' },
    { key: '/', title: '儀表板' },
    { key: '/allocation', title: '配置' },
    { key: 'more', title: '更多' },
  ];
  const PAGES = {
    '/': { title: null, poster: true, segments: ['本週', '波動警報'], actions: [{ key: 'account', symbol: 'person.crop.circle', label: '帳號 Account', sheet: '/account', placement: 'leading' }, { key: 'search', symbol: 'magnifyingglass', label: '搜尋 Search', sheet: '/search' }, { key: 'notifications', symbol: 'bell', label: '推播 Notifications' }, { key: 'refresh', symbol: 'arrow.clockwise', label: '更新最新資料 Refresh' }] },
    '/holdings': { title: '持倉', segments: ['總覽', '交易', '現金流', '觀察清單'], actions: [{ key: 'info', symbol: 'info.circle', label: '說明 How it works', info: '最近交易日＝最新收盤對前一個收盤。' }, { key: 'add', symbol: 'plus', label: '新增交易 Add trade', sheet: '/holdings?sheet=trade' }] },
    '/performance': { title: '績效', segments: ['報酬', '歸因', '費用與稅'], actions: [] },
    '/allocation': { title: '資產配置', segments: ['目標', '合併透視', '產業熱圖', '壓力測試', '效率前緣'], actions: [] },
  };
  let path = PAGES[location.pathname] ? location.pathname : '/';
  let sheet = false;
  let segment = 0;
  let said = '';
  let posts = 0;
  // Opening, as the site's preloading does (9 s here): the shell keeps its cover until this turns true.
  let opened = false;
  setTimeout(() => { opened = true; said = ''; post(); }, 9000);

  function readTop() {
    if (sheet) return { title: '更多', statusBar: 'dark', back: false, actions: [], segments: null };
    const page = PAGES[path];
    return { title: page.title, statusBar: 'dark', back: false, actions: page.actions, segments: { labels: page.segments, current: segment } };
  }
  function post() {
    const state = { v: 1, signedIn: true, path, tab: sheet ? 'more' : path, tabs: TABS, top: readTop(), next: { text: '1 則規則警示。', href: '/', label: '查看', more: 1, later: true, tone: 'act' }, opened };
    const text = JSON.stringify(state);
    if (text === said) return;
    said = text;
    posts += 1;
    window.webkit?.messageHandlers?.shell?.postMessage(state);
    probe();
  }
  function probe() {
    const style = getComputedStyle(document.documentElement);
    const v = (name) => style.getPropertyValue(name).trim() || '-';
    document.getElementById('probe').textContent = `${sheet ? 'more' : path} top=${v('--shell-top')} inline=${v('--shell-top-inline')} bottom=${v('--shell-bottom')} y=${Math.round(scrollY)} posts=${posts}`;
  }
  function render() {
    const page = PAGES[path];
    document.body.className = page.poster ? 'poster' : '';
    let html = page.poster ? '<section class="hero">2026 年 11 月 15 日<b>NT$313,938</b><div id="spark" style="height:120px;margin:16px -16px 0"></div></section>' : '';
    if (path === '/performance' && !sheet) html += '<div class="card"><b>累積報酬</b><div id="line" style="height:220px"></div></div><div class="card"><b>每月報酬</b><div id="bars" style="height:200px"></div></div>';
    for (let i = 1; i <= 14; i += 1) html += `<div class="card">${page.title ?? '儀表板'} · 卡片 ${i}</div>`;
    if (sheet) html += '<div class="sheet"><div class="card">人生規劃</div><div class="card">研究</div><div class="card">設定</div></div>';
    document.getElementById('main').innerHTML = html;
    charts();
  }

  // Charts handed to the shell as the site hands them (components/native-charts.ts, lib/native-chart.ts).
  let drawn = [];
  const chartSay = (message) => window.webkit?.messageHandlers?.chart?.postMessage(message);
  function boxOf(id) {
    const element = document.getElementById(id);
    if (!element || sheet) return null;
    const rect = element.getBoundingClientRect();
    return { x: Math.round(rect.left + scrollX), y: Math.round(rect.top + scrollY), w: Math.round(rect.width), h: Math.round(rect.height) };
  }
  function charts() {
    for (const id of drawn) chartSay({ op: 'remove', id });
    drawn = [];
    const days = Array.from({ length: 40 }, (_, i) => `2026-10-${String((i % 28) + 1).padStart(2, '0')}`);
    const walk = days.map((_, i) => Math.round((Math.sin(i / 4) * 0.012 + i * 0.0006) * 10000) / 10000);
    const specs = {
      spark: { v: 1, spark: true, lineWidth: 3, x: { kind: 'category', values: days }, series: [{ name: '', mark: 'line', color: 'rgb(20, 26, 23)', values: walk, colors: [], stack: null, dashed: false }], rules: [{ axis: 'y', value: 0, color: 'rgba(20, 26, 23, 0.45)', dashed: true }], area: false, xTicks: [], y: { min: -0.02, max: 0.04, ticks: [] }, readouts: [] },
      line: { v: 1, spark: false, x: { kind: 'date', values: days }, series: [{ name: 'SAA 基準', mark: 'line', color: '#8a93a0', values: walk.map((v) => v * 0.8), colors: [], stack: null, dashed: false }, { name: '組合', mark: 'line', color: '#4a86c5', values: walk, colors: [], stack: null, dashed: false }], rules: [], area: false, xTicks: [{ at: 0, label: '10-01' }, { at: 20, label: '10-21' }, { at: 39, label: '11-09' }], y: { min: -0.02, max: 0.04, ticks: [-0.02, 0, 0.02, 0.04].map((v) => ({ value: v, label: `${Math.round(v * 100)}%` })) }, readouts: days.map((d, i) => `${d}\n組合 ${(walk[i] * 100).toFixed(2)}%`) },
      bars: { v: 1, spark: false, x: { kind: 'category', values: ['06', '07', '08', '09', '10', '11'] }, series: [{ name: '當地幣別', mark: 'bar', color: '#4a86c5', values: [0.01, 0.012, -0.004, 0.006, 0.014, 0.008], colors: [], stack: 'split', dashed: false }, { name: '匯率', mark: 'bar', color: '#d9693a', values: [0.002, -0.003, 0.004, 0.001, 0.003, -0.002], colors: [], stack: 'split', dashed: false }, { name: '台幣報酬', mark: 'point', color: '#1f2a3a', values: [0.012, 0.009, 0, 0.007, 0.017, 0.006], colors: [], stack: null, dashed: false }], rules: [], area: false, xTicks: ['06', '07', '08', '09', '10', '11'].map((label, at) => ({ at, label: `2026-${label}` })), y: { min: -0.01, max: 0.02, ticks: [-0.01, 0, 0.01, 0.02].map((v) => ({ value: v, label: `${v * 100}%` })) }, readouts: [] },
    };
    for (const id of Object.keys(specs)) {
      if (!document.getElementById(id)) continue;
      drawn.push(id);
      chartSay({ op: 'set', id, box: boxOf(id), spec: specs[id] });
    }
  }
  function go(target) {
    sheet = false;
    path = PAGES[target] ? target : '/';
    segment = 0;
    history.pushState(null, '', path);
    render();
    scrollTo(0, 0);
    post();
  }
  window.longview = {
    select(key) {
      if (key === 'more') { sheet = !sheet; render(); post(); return; }
      if (sheet) { for (const id of drawn) chartSay({ op: 'move', id, box: null }); }
      if (key !== path) go(key);
      else if (sheet) { sheet = false; render(); post(); }
      else scrollTo({ top: 0, behavior: 'smooth' });
    },
    // `/__scroll/600` scrolls the page (ios/tests/look.sh); any other path opens that page.
    open(raw) {
      const scroll = /^\/__scroll\/(\d+)/.exec(raw);
      if (scroll) { scrollTo(0, Number(scroll[1])); return; }
      go(raw.split('?')[0]);
    },
    segment(index) { segment = index; post(); },
    action() {},
    later() {},
    refresh() { return Promise.resolve(); },
    remindersStatus() {},
  };
  addEventListener('scroll', () => { post(); probe(); }, { passive: true });
  new MutationObserver(probe).observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
  render();
  post();
</script>
</body>
</html>
