<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shell look</title>
<!--
  A stand-in for the site, for ios/tests/look.sh only: it talks to the shell exactly as
  components/shell-bridge.tsx does (one `shell` message per change of what the page shows, and
  window.longview for the shell's calls), with pages shaped like the site's: a poster on the
  dashboard, a title and a row of sub-tabs elsewhere, the More list over the page. The yellow line
  at the foot says what the shell told the page (--shell-top, --shell-top-inline, --shell-bottom).
-->
<style>
  html { background: #f2f2f7; }
  body { margin: 0; font: -apple-system-body; color: #000; padding-top: var(--shell-top, 0px); padding-bottom: calc(var(--shell-bottom, 0px) + 40px); }
  body.poster { padding-top: 0; }
  .hero { background: #34689c; color: #fff; padding: calc(var(--shell-top-inline, 100px) + 40px) 16px 60px; }
  .hero b { display: block; font-size: 44px; }
  .card { background: #fff; border-radius: 22px; margin: 12px 16px; padding: 16px; min-height: 90px; }
  .sheet { position: fixed; inset: 0; z-index: 5; background: #f2f2f7; padding: calc(var(--shell-top-inline, 100px) + 12px) 16px 0; }
  #probe { position: fixed; left: 8px; right: 8px; bottom: calc(var(--shell-bottom, 0px) + 6px); z-index: 9; font: 12px/1.3 ui-monospace, monospace; background: #ffeb3b; color: #000; padding: 3px 6px; border-radius: 6px; }
</style>
</head>
<body>
<main id="main"></main>
<div id="probe"></div>
<script>
  const TABS = [
    { key: '/holdings', title: '持倉' },
    { key: '/performance', title: '績效' },
    { key: '/', title: '儀表板' },
    { key: '/allocation', title: '配置' },
    { key: 'more', title: '更多' },
  ];
  const PAGES = {
    '/': { title: null, poster: true, segments: ['本週', '波動警報'], actions: [{ key: 'refresh', symbol: 'arrow.clockwise', label: '更新最新資料 Refresh' }] },
    '/holdings': { title: '持倉', segments: ['總覽', '交易', '現金流', '觀察清單'], actions: [{ key: 'add', symbol: 'plus', label: '新增交易 Add trade', sheet: '/holdings?sheet=trade' }] },
    '/performance': { title: '績效', segments: ['報酬', '歸因', '費用與稅'], actions: [] },
    '/allocation': { title: '資產配置', segments: ['目標', '合併透視', '產業熱圖', '壓力測試', '效率前緣'], actions: [] },
  };
  let path = PAGES[location.pathname] ? location.pathname : '/';
  let sheet = false;
  let segment = 0;
  let said = '';
  let posts = 0;

  function top() {
    if (sheet) return { title: '更多', statusBar: 'dark', back: false, actions: [], segments: null };
    const page = PAGES[path];
    return { title: page.title, statusBar: page.poster && scrollY < 200 ? 'light' : 'dark', back: false, actions: page.actions, segments: { labels: page.segments, current: segment } };
  }
  function post() {
    const state = { v: 1, signedIn: true, path, tab: sheet ? 'more' : path, tabs: TABS, top: top(), next: null };
    const text = JSON.stringify(state);
    if (text === said) return;
    said = text;
    posts += 1;
    window.webkit?.messageHandlers?.shell?.postMessage(state);
    probe();
  }
  function probe() {
    const style = getComputedStyle(document.documentElement);
    const v = (name) => style.getPropertyValue(name).trim() || '-';
    document.getElementById('probe').textContent = `${sheet ? 'more' : path} top=${v('--shell-top')} inline=${v('--shell-top-inline')} bottom=${v('--shell-bottom')} y=${Math.round(scrollY)} posts=${posts}`;
  }
  function render() {
    const page = PAGES[path];
    document.body.className = page.poster ? 'poster' : '';
    let html = page.poster ? '<section class="hero">2026 年 11 月 15 日<b>NT$313,938</b></section>' : '';
    for (let i = 1; i <= 14; i += 1) html += `<div class="card">${page.title ?? '儀表板'} · 卡片 ${i}</div>`;
    if (sheet) html += '<div class="sheet"><div class="card">人生規劃</div><div class="card">研究</div><div class="card">設定</div></div>';
    document.getElementById('main').innerHTML = html;
  }
  function go(target) {
    sheet = false;
    path = PAGES[target] ? target : '/';
    segment = 0;
    history.pushState(null, '', path);
    render();
    scrollTo(0, 0);
    post();
  }
  window.longview = {
    select(key) {
      if (key === 'more') { sheet = !sheet; render(); post(); return; }
      if (key !== path) go(key);
      else if (sheet) { sheet = false; render(); post(); }
      else scrollTo({ top: 0, behavior: 'smooth' });
    },
    // `/__scroll/600` scrolls the page (ios/tests/look.sh); any other path opens that page.
    open(raw) {
      const scroll = /^\/__scroll\/(\d+)/.exec(raw);
      if (scroll) { scrollTo(0, Number(scroll[1])); return; }
      go(raw.split('?')[0]);
    },
    segment(index) { segment = index; post(); },
    action() {},
    later() {},
    refresh() { return Promise.resolve(); },
    remindersStatus() {},
  };
  addEventListener('scroll', () => { post(); probe(); }, { passive: true });
  new MutationObserver(probe).observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
  render();
  post();
</script>
</body>
</html>
